name: release

# Tags a plain vX.Y.Z (and a GitHub release) after `test` passes on main, so
# callers can pin `uses: NoahJenkins/.github@<sha> # vX.Y.Z` and let their
# Dependabot (github-actions ecosystem) bump the SHA and the comment together.
#   - patch by default; label the merged PR `semver:minor` or `semver:major`
#   - no release when no action code changed (docs, tests, workflows only)
#   - idempotent: a commit that already has a version tag is left alone
#   - GITHUB_TOKEN only; a tag it pushes triggers no further workflows, which is fine here
on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  # Merges done by auto-merge (Dependabot pin bumps) start no push workflows,
  # so neither `test` on main nor the trigger above fires for them. This weekly
  # sweep tests main and releases any action change that is not released yet.
  schedule:
    - cron: "17 15 * * 2"
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump. A manual run always releases.
        type: choice
        options: [patch, minor, major]
        default: patch

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'schedule'
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    # A manual run releases main only, never another branch's commit. The
    # sweep releases only after its own test run passed.
    if: >-
      always() && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
        || (github.event_name == 'schedule' && needs.test.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the tag and the release
      pull-requests: read # read the merged pull request's labels
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          MANUAL: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if git tag --points-at "$SHA" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "already released"
            exit 0
          fi
          # Plain vX.Y.Z only: a hand-made v1.2.0-rc1 must not become the base.
          last=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          # Never give an older commit a newer version (a re-run of an old
          # release run): Dependabot would then "upgrade" callers backwards.
          if [ -n "$last" ] && ! git merge-base --is-ancestor "$last" "$SHA"; then
            echo "$SHA does not contain $last; not releasing an older commit"
            exit 0
          fi
          if [ -n "$last" ] && [ -z "$MANUAL" ] && \
             [ -z "$(git diff --name-only "$last" "$SHA" -- action.yml pr-repair review-gate ':!**/test/**' ':!**/*.md')" ]; then
            echo "no action code changed since $last"
            exit 0
          fi
          bump=${MANUAL:-patch}
          labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '[.[].labels[].name] | join(",")' || true)
          case ",$labels," in
            *,semver:major,*) bump=major ;;
            *,semver:minor,*) if [ "$bump" = patch ]; then bump=minor; fi ;;
          esac
          IFS=. read -r ma mi pa <<<"${last#v}"
          ma=${ma:-0}; mi=${mi:-0}; pa=${pa:-0}
          if [ -z "$last" ]; then
            next=v1.0.0
          else
            case $bump in
              major) next="v$((ma + 1)).0.0" ;;
              minor) next="v$ma.$((mi + 1)).0" ;;
              *) next="v$ma.$mi.$((pa + 1))" ;;
            esac
          fi
          echo "releasing $next ($bump) at $SHA"
          gh release create "$next" --target "$SHA" --title "$next" --generate-notes
