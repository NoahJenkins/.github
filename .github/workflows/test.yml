name: test

on:
  # Every pull request runs it: `test` is a required check, and a check that
  # never starts would block docs-only PRs.
  pull_request:
  # The weekly release sweep runs it before tagging (see release.yml).
  workflow_call:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Unit and end-to-end tests
        run: npm test
      - name: Container isolation tests
        run: npm run test:docker
