name: dependabot auto-merge

# Arm native auto-merge for minor and patch bumps in every ecosystem, and for
# every github-actions update, including semver-major. fetch-metadata reports
# that ecosystem as `github_actions`. A semver-major anywhere else is labelled
# `dependency-major` and left for a person. The required `test` check makes
# GitHub wait for green. No PR code is checked out or run.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Arm auto-merge, or label a major
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: |
          set -euo pipefail
          # Hold a major unless fetch-metadata says github_actions. A security
          # note in the body does not make any other ecosystem's major eligible.
          if [ "$UPDATE_TYPE" = version-update:semver-major ] && [ "$ECOSYSTEM" != github_actions ]; then
            gh label create dependency-major --color FBCA04 \
              --description "Major dependency update; needs a person" 2>/dev/null || true
            gh pr edit "$PR_URL" --add-label dependency-major
            exit 0
          fi
          gh pr merge "$PR_URL" --auto --squash
